[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoui"
version = "2.0.0"
description = "Pure Python UI framework with terminal/web/desktop adapters"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["ui", "tui", "terminal", "web", "framework", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]
dependencies = [
    "typing-extensions>=4.7.0",
    "rich>=13.0.0",
    "wcwidth>=0.2.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/echoui/echoui"
Documentation = "https://github.com/echoui/echoui#readme"
Repository = "https://github.com/echoui/echoui"
Issues = "https://github.com/echoui/echoui/issues"

[project.optional-dependencies]
flask = ["flask>=2.3.0"]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
qt = ["PyQt6>=6.5.0"]
db-postgres = ["asyncpg>=0.28.0"]
db-mysql = ["aiomysql>=0.2.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "pylint>=3.0.0",
    "flake8>=6.1.0",
    "aiosqlite>=0.19.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
py_version = 38
known_first_party = ["echoui"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["wcwidth.*", "psutil.*", "rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src/echoui"]
branch = true
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.pylint.master]
ignore = ["__pycache__"]

[tool.pylint.messages_control]
disable = [
    "C0114",
    "C0115",
    "C0116",
    "R0903",
]

[tool.pylint.format]
max-line-length = 88
